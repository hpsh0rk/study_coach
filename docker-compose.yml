# Local stand-in for Cloudflare Containers (not available on the Workers Free plan).
# Start it, then run the Worker with PARSER=heavy:
#   docker compose up -d heavy
#   pnpm dev -- --var PARSER:heavy
services:
  heavy:
    build:
      context: ./containers/heavy
      args:
        INSTALL_DOCLING: ${INSTALL_DOCLING:-0}
        # Mainland China mirror example: PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      HEAVY_WORKERS: "1"
      LOG_LEVEL: INFO
    # Lets the container reach `wrangler dev` on the host via CALLBACK_BASE_URL=http://host.docker.internal:8787.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
